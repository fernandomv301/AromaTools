[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aromatools"
version = "0.2.49"
description = "Tools for aromaticity evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Fernando Martínez-Villarino" },
  { name = "Joan Grebol-Tomas" },
  { name = "Pedro Salvador" },
  { name = "Mesías Orozco-Ic" },
  { name = "Eduard Matito" },
  { name = "Gabriel Merino" }
]
dependencies = [
  "esipython",
  "numpy",
  "matplotlib",
  "ase",
  "pymatgen",
  "networkx"
]

[project.scripts]
amg            = "aromatools.aromagnetic.aromagnetic:main"
aromagnetic    = "aromatools.aromagnetic.aromagnetic:main"
arogeometric   = "aromatools.arogeometric.arogeometric:main"
aroelectronics = "aromatools.aroelectronics.aroelectronics:main"
